name: Report a Safety Concern
description: Flag harmful guidance, missing permissions, or an accessibility issue without sharing sensitive data.
title: "[Safety]: "
labels: ["safety", "needs-review"]
body:
  - type: markdown
    attributes:
      value: |
        **Do not disclose an active vulnerability, credential, personal information, FERPA record, research-participant data, or other restricted material here.** Use the appropriate private Virginia Tech reporting channel.
  - type: dropdown
    id: category
    attributes:
      label: Concern type
      options: [Data handling, Misleading approval claim, Plugin or permission risk, Harmful or inequitable guidance, Accessibility barrier, Other]
    validations:
      required: true
  - type: input
    id: location
    attributes:
      label: Public page or component
      placeholder: Route, record, or visible label
    validations:
      required: true
  - type: textarea
    id: concern
    attributes:
      label: Concern and plausible harm
      description: Describe the issue using a sanitized example only.
    validations:
      required: true
  - type: textarea
    id: fix
    attributes:
      label: Evidence or suggested correction
      description: Link official guidance where available.
  - type: checkboxes
    id: privacy
    attributes:
      label: Public issue check
      options:
        - label: I removed sensitive details and understand this report will be public.
          required: true
