name: Report Outdated Information
description: Identify a stale claim and provide newer first-party evidence.
title: "[Outdated]: "
labels: ["content", "outdated"]
body:
  - type: input
    id: page
    attributes:
      label: Affected page or record
      placeholder: URL, route, tool, or skill slug
    validations:
      required: true
  - type: textarea
    id: claim
    attributes:
      label: Exact outdated claim
      description: Quote only the minimum text needed to locate it.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: New authoritative evidence
      description: Link the canonical source and explain what changed.
    validations:
      required: true
  - type: input
    id: verified
    attributes:
      label: Verification date
      placeholder: YYYY-MM-DD
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope and boundary
      description: Which account, plan, platform, audience, or data condition does the correction cover?
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Public issue check
      options:
        - label: This report contains no sensitive, private, proprietary, or security-restricted information.
          required: true
